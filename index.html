<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Site Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the stored theme before first paint to avoid a light-mode flash.
      // Kept in sync with src/lib/theme.ts (storage key "site-analytics-theme").
      (function () {
        try {
          var stored = localStorage.getItem("site-analytics-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* no-op: default to light */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
